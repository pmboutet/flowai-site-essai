<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Essai flowAI — notes</title>
  <link rel="stylesheet" href="style.css">
  <script src="__flowai/sheets.js"></script>
</head>
<body>
  <main>
    <h1>Essai flowAI</h1>
    <p id="version">Version 1</p>
    <form id="f">
      <label>Juré <input name="Juré" required></label>
      <label>Équipe <input name="Équipe" required></label>
      <label>Note <input name="Note" type="number" min="0" max="20" required></label>
      <button>Envoyer</button>
    </form>
    <p id="etat"></p>
    <h2>Lignes</h2>
    <pre id="lignes">(lecture non chargée)</pre>
  </main>
  <script>
    var etat = document.getElementById('etat');
    function charger() {
      flowai.sheet('notes').rows()
        .then(function (rows) { document.getElementById('lignes').textContent = JSON.stringify(rows, null, 2); })
        .catch(function (e) { document.getElementById('lignes').textContent = 'Lecture : ' + e.message; });
    }
    document.getElementById('f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var d = new FormData(ev.target);
      flowai.sheet('notes').append({ 'Juré': d.get('Juré'), 'Équipe': d.get('Équipe'), 'Note': Number(d.get('Note')) })
        .then(function (r) { etat.textContent = 'Enregistré (' + r.appended + ')'; charger(); })
        .catch(function (e) { etat.textContent = 'Erreur : ' + e.message; });
    });
    charger();
  </script>
</body>
</html>
